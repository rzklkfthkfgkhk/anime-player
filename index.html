<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeGlass · плеер</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #0d0f14;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            color: #f0f3fa;
        }

        .app {
            max-width: 1280px;
            width: 100%;
            background: rgba(20, 25, 35, 0.45);
            backdrop-filter: blur(12px);
            border-radius: 2.5rem;
            padding: 2rem;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1.2rem;
            margin-bottom: 2rem;
        }

        .logo {
            font-size: 1.9rem;
            font-weight: 600;
            background: linear-gradient(145deg, #d4e0ff, #a0b9ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .search-input {
            flex: 1 1 240px;
            padding: 0.7rem 1.2rem;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(12, 16, 24, 0.7);
            color: #f0f3fa;
            font-size: 0.95rem;
            outline: none;
        }
        .search-input::placeholder {
            color: #7b88a3;
        }
        .search-input:focus {
            border-color: #7d9cff;
        }

        .player-section {
            background: rgba(10, 14, 22, 0.4);
            backdrop-filter: blur(4px);
            border-radius: 2rem;
            padding: 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.03);
            margin-bottom: 1.8rem;
        }

        .tabs {
            display: flex;
            gap: 0.6rem;
            margin-bottom: 1.2rem;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: rgba(30, 38, 54, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 0.55rem 1.6rem;
            border-radius: 40px;
            font-size: 0.95rem;
            font-weight: 500;
            color: #b2c3e0;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .tab-btn:hover {
            background: rgba(60, 80, 130, 0.5);
            color: #ffffff;
            transform: scale(1.02);
        }
        .tab-btn.active {
            background: rgba(70, 120, 255, 0.25);
            border-color: #6b93ff;
            color: white;
            box-shadow: 0 0 20px rgba(80, 140, 255, 0.15);
        }

        .player-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #080b10;
            border-radius: 1.5rem;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .player-container video {
            width: 100%;
            height: 100%;
            display: block;
            background: #0a0d12;
            outline: none;
        }

        .player-container .placeholder {
            color: #48526b;
            font-size: 1.2rem;
            text-align: center;
            padding: 1rem;
        }

        .info-block {
            margin-top: 1.8rem;
        }

        .title-row {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 0.6rem 1.2rem;
        }

        .anime-title {
            font-size: 1.8rem;
            font-weight: 600;
            background: linear-gradient(135deg, #f0f4ff, #c6d9ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .rating {
            background: rgba(255, 215, 0, 0.08);
            padding: 0.2rem 1rem;
            border-radius: 40px;
            border: 1px solid rgba(255, 215, 0, 0.1);
            color: #f5d742;
            display: inline-flex;
            align-items: center;
        }
        .rating::before {
            content: "★";
            color: #f5b342;
            margin-right: 0.3rem;
        }

        .description {
            margin-top: 0.4rem;
            color: #b8c9ed;
            line-height: 1.5;
            font-size: 0.98rem;
            opacity: 0.9;
        }

        .episode-block {
            margin-top: 2.2rem;
        }

        .episode-label {
            font-size: 1.1rem;
            color: #a7bae0;
            margin-bottom: 0.9rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.8rem;
        }

        .episode-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .ep-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 3.4rem;
            height: 3.4rem;
            border-radius: 18px;
            background: rgba(30, 40, 60, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: #c6d4f0;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .ep-btn:hover {
            background: rgba(70, 110, 220, 0.3);
            border-color: rgba(130, 180, 255, 0.3);
            transform: translateY(-3px);
            color: white;
        }
        .ep-btn.active {
            background: rgba(70, 130, 255, 0.35);
            border-color: #6b93ff;
            color: white;
            box-shadow: 0 0 20px rgba(70, 130, 255, 0.25);
        }

        @media (max-width: 720px) {
            .app {
                padding: 1.2rem;
            }
            .anime-title {
                font-size: 1.4rem;
            }
            .ep-btn {
                width: 2.9rem;
                height: 2.9rem;
                font-size: 0.95rem;
            }
            .tab-btn {
                padding: 0.4rem 1.2rem;
                font-size: 0.85rem;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
            }
        }

        .footer-meta {
            font-size: 0.7rem;
            color: #48526b;
            margin-top: 1rem;
            text-align: right;
            opacity: 0.5;
        }
        .video-source-info {
            font-size: 0.7rem;
            color: #48526b;
            margin-top: 0.5rem;
            text-align: center;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="logo">✦ AnimeGlass</div>
            <input class="search-input" type="text" placeholder="Поиск аниме..." id="searchInput">
        </header>

        <section class="player-section">
            <div class="tabs">
                <button class="tab-btn active" data-player="video">🎬 Видео</button>
                <button class="tab-btn" data-player="kodik">Kodik</button>
                <button class="tab-btn" data-player="alloha">Alloha</button>
            </div>

            <div class="player-container" id="playerContainer">
                <div id="placeholder" class="placeholder">📹 Выберите серию</div>
                <video id="videoPlayer" controls preload="metadata" style="display:none;width:100%;height:100%;">
                    <source id="videoSource" src="" type="video/mp4">
                    Ваш браузер не поддерживает видео.
                </video>
            </div>

            <div class="info-block">
                <div class="title-row">
                    <h1 class="anime-title" id="animeTitle">Тёмный дворецкий</h1>
                    <span class="rating" id="animeRating">8.7</span>
                </div>
                <p class="description" id="animeDescription">Молодой граф Сиэль Фантомхайв заключает контракт с демоном, чтобы отомстить за гибель семьи.</p>
            </div>
        </section>

        <div class="episode-block">
            <div class="episode-label">
                <span>Список серий</span>
                <span id="episodeCount">1–12</span>
            </div>
            <div class="episode-grid" id="episodeGrid"></div>
        </div>
        <div class="footer-meta">• плеер запоминает выбор •</div>
    </div>

    <script>
        (function() {
            "use strict";

            // ================================================================
            //  📹  ЗАМЕНИТЕ ЭТИ ССЫЛКИ НА РЕАЛЬНЫЕ ВИДЕО-ФАЙЛЫ (MP4)
            // ================================================================
            const VIDEO_URLS = [
                "https://sample-videos.com/video321/mp4/720/big_buck_bunny_720p_1mb.mp4",
                "https://sample-videos.com/video321/mp4/720/big_buck_bunny_720p_1mb.mp4",
                "https://sample-videos.com/video321/mp4/720/big_buck_bunny_720p_1mb.mp4",
                "https://sample-videos.com/video321/mp4/720/big_buck_bunny_720p_1mb.mp4",
                "https://sample-videos.com/video321/mp4/720/big_buck_bunny_720p_1mb.mp4",
                "https://sample-videos.com/video321/mp4/720/big_buck_bunny_720p_1mb.mp4",
                "https://sample-videos.com/video321/mp4/720/big_buck_bunny_720p_1mb.mp4",
                "https://sample-videos.com/video321/mp4/720/big_buck_bunny_720p_1mb.mp4",
                "https://sample-videos.com/video321/mp4/720/big_buck_bunny_720p_1mb.mp4",
                "https://sample-videos.com/video321/mp4/720/big_buck_bunny_720p_1mb.mp4",
                "https://sample-videos.com/video321/mp4/720/big_buck_bunny_720p_1mb.mp4",
                "https://sample-videos.com/video321/mp4/720/big_buck_bunny_720p_1mb.mp4"
            ];

            // ================================================================

            const video = document.getElementById('videoPlayer');
            const videoSource = document.getElementById('videoSource');
            const placeholder = document.getElementById('placeholder');
            const tabBtns = document.querySelectorAll('.tab-btn');
            const epGrid = document.getElementById('episodeGrid');
            const animeTitle = document.getElementById('animeTitle');
            const animeRating = document.getElementById('animeRating');
            const animeDescription = document.getElementById('animeDescription');
            const episodeCount = document.getElementById('episodeCount');
            const searchInput = document.getElementById('searchInput');

            let currentSource = 'video';
            let currentEpisode = 1;
            const totalEpisodes = 12;

            // ================================================================

            function init() {
                const savedSource = localStorage.getItem('anime_player_source');
                if (savedSource === 'kodik' || savedSource === 'alloha' || savedSource === 'video') {
                    currentSource = savedSource;
                }

                const savedEp = localStorage.getItem('anime_player_episode');
                if (savedEp) {
                    const ep = parseInt(savedEp, 10);
                    if (!isNaN(ep) && ep >= 1 && ep <= totalEpisodes) {
                        currentEpisode = ep;
                    }
                }

                buildEpisodeButtons();
                updateTabsAndPlayer();

                tabBtns.forEach(btn => {
                    btn.addEventListener('click', function() {
                        const source = this.dataset.player;
                        if (source === 'kodik' || source === 'alloha' || source === 'video') {
                            currentSource = source;
                            localStorage.setItem('anime_player_source', currentSource);
                            updateTabsAndPlayer();
                        }
                    });
                });

                // Поиск по названию (для демонстрации)
                searchInput.addEventListener('input', function() {
                    const query = this.value.toLowerCase().trim();
                    // Просто демонстрация
                    if (query.length > 0) {
                        animeTitle.textContent = `🔍 ${query}`;
                    } else {
                        animeTitle.textContent = 'Тёмный дворецкий';
                    }
                });
            }

            function buildEpisodeButtons() {
                epGrid.innerHTML = '';
                for (let i = 1; i <= totalEpisodes; i++) {
                    const btn = document.createElement('button');
                    btn.className = 'ep-btn';
                    btn.textContent = i;
                    btn.dataset.ep = i;
                    if (i === currentEpisode) {
                        btn.classList.add('active');
                    }
                    btn.addEventListener('click', function() {
                        const ep = parseInt(this.dataset.ep, 10);
                        if (!isNaN(ep) && ep >= 1 && ep <= totalEpisodes) {
                            currentEpisode = ep;
                            localStorage.setItem('anime_player_episode', String(currentEpisode));
                            document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
                            this.classList.add('active');
                            updatePlayerSrc();
                        }
                    });
                    epGrid.appendChild(btn);
                }
                episodeCount.textContent = `1–${totalEpisodes}`;
            }

            function updateTabsAndPlayer() {
                tabBtns.forEach(btn => {
                    const src = btn.dataset.player;
                    if (src === currentSource) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });
                updatePlayerSrc();
            }

            function updatePlayerSrc() {
                // Всегда показываем видео-плеер
                video.style.display = 'block';
                placeholder.style.display = 'none';

                const videoUrl = VIDEO_URLS[currentEpisode - 1];

                if (videoUrl && videoUrl.length > 0) {
                    videoSource.src = videoUrl;
                    video.load();
                    video.play().catch(e => {
                        console.log('Автовоспроизведение заблокировано');
                    });
                    console.log(`▶️ Серия ${currentEpisode}: ${videoUrl}`);
                } else {
                    video.style.display = 'none';
                    placeholder.style.display = 'flex';
                    placeholder.textContent = '❌ Видео не найдено';
                }
            }

            // Запуск
            init();
        })();
    </script>
</body>
</html>
