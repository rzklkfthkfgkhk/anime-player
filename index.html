<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Смотреть аниме — Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0a0a0f; color: #fff; }
        .navbar { background: #14141e; padding: 15px 30px; display: flex; align-items: center; gap: 20px; border-bottom: 1px solid #2a2a3a; flex-wrap: wrap; }
        .navbar a { color: #e94560; text-decoration: none; font-weight: bold; font-size: 1.5rem; }
        .navbar span { color: #888; font-size: 0.9rem; }
        .player-wrapper { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 15px; background: #000; box-shadow: 0 20px 60px rgba(233, 69, 96, 0.2); }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .controls { margin-top: 25px; display: flex; flex-wrap: wrap; gap: 15px; align-items: center; background: #14141e; padding: 15px 25px; border-radius: 15px; }
        .controls label { color: #aaa; font-size: 0.9rem; }
        .controls select { background: #1e1e2a; color: #fff; padding: 10px 20px; border-radius: 30px; border: 1px solid #333; cursor: pointer; flex: 1; min-width: 120px; }
        .controls select:focus { outline: 2px solid #e94560; }
        .episode-list { margin-top: 30px; background: #14141e; padding: 20px; border-radius: 15px; }
        .episode-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; }
        .ep-btn { background: #1e1e2a; padding: 8px 18px; border-radius: 30px; border: 1px solid #333; color: #aaa; cursor: pointer; transition: 0.2s; }
        .ep-btn:hover { background: #e94560; color: #fff; border-color: #e94560; }
        .ep-btn.active { background: #e94560; color: #fff; border-color: #e94560; }
        .info-title { font-size: 1.8rem; margin-bottom: 10px; }
        .back-btn { background: #e94560; padding: 8px 25px; border-radius: 30px; border: none; color: #fff; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; }
        .back-btn:hover { background: #ff6b81; }
        .loading-player { text-align: center; padding: 30px; color: #888; }
        .player-error { color: #e94560; text-align: center; padding: 30px; }
        .video-source-info { font-size: 0.8rem; color: #666; margin-top: 10px; text-align: center; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .spinner { display: inline-block; width: 40px; height: 40px; border: 4px solid #333; border-top: 4px solid #e94560; border-radius: 50%; animation: spin 1s linear infinite; }
        @media (max-width: 600px) { .navbar { flex-direction: column; align-items: flex-start; } .controls { flex-direction: column; align-items: stretch; } }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="index.html">🏠 AnimeHub</a>
        <span>▶ Сейчас смотрим</span>
        <span id="animeTitleDisplay" style="margin-left: auto; color: #e94560; font-weight: bold;">Загрузка...</span>
    </div>

    <div class="player-wrapper">
        <h2 id="animeTitle" class="info-title">Загрузка информации...</h2>
        
        <div class="video-container" id="videoContainer">
            <div id="playerLoader" style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; background:#111;">
                <div class="spinner"></div>
                <p style="margin-top:20px; color:#888;">Загрузка плеера...</p>
            </div>
            <iframe id="animeIframe" src="about:blank" allowfullscreen style="display:none;"></iframe>
        </div>

        <div class="controls">
            <label>🎙 Озвучка:</label>
            <select id="voiceSelect" onchange="changeVoice()">
                <option value="kodik">Kodik (Официальный)</option>
                <option value="anilibria">AniLibria</option>
                <option value="anidub">AniDUB</option>
                <option value="jutsu">Jutsu</option>
            </select>
            
            <label>📺 Серия:</label>
            <select id="episodeSelect" onchange="changeEpisode()">
                <option value="1">1 серия</option>
            </select>

            <a href="index.html" class="back-btn">← Назад</a>
        </div>

        <div class="episode-list">
            <h4>Все серии</h4>
            <div class="episode-grid" id="episodeGrid">
                <div style="color:#888; padding:10px;">Загрузка серий...</div>
            </div>
        </div>
        
        <div class="video-source-info" id="sourceInfo">Источник: Kodik</div>
    </div>

    <script>
        // Получаем код аниме из URL
        const urlParams = new URLSearchParams(window.location.search);
        let animeCode = urlParams.get('code') || 'jujutsu-kaisen';
        let currentEpisode = 1;
        let currentVoice = 'kodik';
        let animeId = null;
        let animeTitle = '';

        // Провайдеры видео (работают через внешние плееры)
        // Используем актуальные embed-ссылки
        const videoProviders = {
            'kodik': (id, ep) => {
                // Kodik - самый стабильный, используем поиск по названию
                return `https://kodik.cc/serial/${id}/${ep}/720p`;
            },
            'anilibria': (id, ep) => {
                return `https://anilibria.tv/embed/${id}/${ep}`;
            },
            'anidub': (id, ep) => {
                return `https://anidub.com/player/${id}/${ep}`;
            },
            'jutsu': (id, ep) => {
                return `https://jut.su/${id}/season-1/episode-${ep}.html`;
            }
        };

        // База аниме с ID для Kodik (у каждого аниме свой ID в Kodik)
        // Это нужно для правильной работы плеера
        const animeDatabase = {
            'jujutsu-kaisen': { id: 'jujutsu-kaisen', title: 'Магическая битва', kodikId: 'jujutsu-kaisen' },
            'jujutsu-kaisen-2': { id: 'jujutsu-kaisen-2', title: 'Магическая битва 2 сезон', kodikId: 'jujutsu-kaisen' },
            'naruto': { id: 'naruto', title: 'Наруто', kodikId: 'naruto' },
            'one-piece': { id: 'one-piece', title: 'One Piece', kodikId: 'one-piece' },
            'attack-on-titan': { id: 'attack-on-titan', title: 'Атака Титанов', kodikId: 'shingeki-no-kyojin' },
            'demon-slayer': { id: 'demon-slayer', title: 'Клинок Рассекающий Демонов', kodikId: 'kimetu-no-yaiba' },
            'spy-x-family': { id: 'spy-x-family', title: 'Spy x Family', kodikId: 'spy-x-family' },
            'chainsaw-man': { id: 'chainsaw-man', title: 'Человек-бензопила', kodikId: 'chainsaw-man' },
            'death-note': { id: 'death-note', title: 'Тетрадь смерти', kodikId: 'death-note' },
            'fullmetal-alchemist': { id: 'fullmetal-alchemist', title: 'Стальной Алхимик', kodikId: 'fullmetal-alchemist' }
        };

        // Функция получения данных об аниме
        async function fetchAnimeData(code) {
            // Сначала проверяем локальную базу
            if (animeDatabase[code]) {
                return animeDatabase[code];
            }

            // Если нет в базе - пробуем API Anilibria
            try {
                const response = await fetch(`https://api.anilibria.tv/v2/title/search?query=${encodeURIComponent(code)}`);
                const data = await response.json();
                
                if (Array.isArray(data) && data.length > 0) {
                    const result = data[0];
                    return {
                        id: result.id,
                        title: result.title,
                        kodikId: result.code || result.id
                    };
                }
                return null;
            } catch (error) {
                console.error('Ошибка API:', error);
                return null;
            }
        }

        // Основная функция загрузки плеера
        async function loadPlayer() {
            const titleDisplay = document.getElementById('animeTitleDisplay');
            const titleElem = document.getElementById('animeTitle');
            const grid = document.getElementById('episodeGrid');
            const loader = document.getElementById('playerLoader');
            const iframe = document.getElementById('animeIframe');

            try {
                // Получаем данные об аниме
                const data = await fetchAnimeData(animeCode);
                
                if (data) {
                    animeTitle = data.title;
                    animeId = data.kodikId || data.id;
                    titleDisplay.textContent = animeTitle;
                    titleElem.textContent = animeTitle;
                } else {
                    // Если не нашли - используем заглушку
                    animeTitle = decodeURIComponent(animeCode).replace(/-/g, ' ').toUpperCase();
                    animeId = decodeURIComponent(animeCode).replace(/\s/g, '-').toLowerCase();
                    titleDisplay.textContent = animeTitle;
                    titleElem.textContent = animeTitle;
                }

                // Генерируем серии (по умолчанию 12)
                const episodes = 12;
                grid.innerHTML = '';
                for (let i = 1; i <= episodes; i++) {
                    const btn = document.createElement('div');
                    btn.className = 'ep-btn' + (i === currentEpisode ? ' active' : '');
                    btn.textContent = i;
                    btn.onclick = function() {
                        document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
                        this.classList.add('active');
                        currentEpisode = i;
                        document.getElementById('episodeSelect').value = i;
                        updateVideo();
                    };
                    grid.appendChild(btn);
                }

                // Обновляем селектор серий
                const epSelect = document.getElementById('episodeSelect');
                epSelect.innerHTML = '';
                for (let i = 1; i <= episodes; i++) {
                    const opt = document.createElement('option');
                    opt.value = i;
                    opt.textContent = i + ' серия';
                    if (i === currentEpisode) opt.selected = true;
                    epSelect.appendChild(opt);
                }

                // Загружаем видео
                updateVideo();

            } catch (error) {
                console.error('Ошибка:', error);
                grid.innerHTML = `<div class="player-error">⚠️ Ошибка загрузки данных</div>`;
                titleDisplay.textContent = 'Ошибка';
                titleElem.textContent = 'Ошибка загрузки';
            }
        }

        function updateVideo() {
            const iframe = document.getElementById('animeIframe');
            const loader = document.getElementById('playerLoader');
            const sourceInfo = document.getElementById('sourceInfo');
            
            // Получаем ссылку на видео
            const provider = videoProviders[currentVoice] || videoProviders['kodik'];
            
            // Для Kodik используем специальный формат
            let videoUrl;
            if (currentVoice === 'kodik') {
                // Для Kodik используем поиск по названию
                const searchQuery = encodeURIComponent(animeTitle || animeCode);
                videoUrl = `https://kodik.cc/serial/${animeId}/${currentEpisode}/720p`;
                sourceInfo.textContent = `Источник: Kodik (${animeTitle})`;
            } else if (currentVoice === 'jutsu') {
                videoUrl = `https://jut.su/${animeId}/season-1/episode-${currentEpisode}.html`;
                sourceInfo.textContent = `Источник: Jut.su`;
            } else {
                // Для других провайдеров
                const id = typeof animeId === 'string' ? animeId.replace(/[^0-9]/g, '') : animeId;
                videoUrl = provider(id || 85, currentEpisode);
                sourceInfo.textContent = `Источник: ${currentVoice.charAt(0).toUpperCase() + currentVoice.slice(1)}`;
            }
            
            // Показываем iframe с видео
            iframe.style.display = 'block';
            loader.style.display = 'none';
            iframe.src = videoUrl;
            
            // Логируем для отладки
            console.log('Загружено видео:', videoUrl);
        }

        function changeVoice() {
            currentVoice = document.getElementById('voiceSelect').value;
            // Показываем загрузчик
            document.getElementById('playerLoader').style.display = 'flex';
            document.getElementById('animeIframe').style.display = 'none';
            setTimeout(() => updateVideo(), 300);
        }

        function changeEpisode() {
            currentEpisode = parseInt(document.getElementById('episodeSelect').value);
            document.querySelectorAll('.ep-btn').forEach((btn, index) => {
                btn.classList.toggle('active', (index + 1) === currentEpisode);
            });
            // Показываем загрузчик
            document.getElementById('playerLoader').style.display = 'flex';
            document.getElementById('animeIframe').style.display = 'none';
            setTimeout(() => updateVideo(), 300);
        }

        // Запускаем загрузку
        loadPlayer();
    </script>
</body>
</html>
