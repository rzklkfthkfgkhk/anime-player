<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeGlass</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0f;
            color: #fff;
            min-height: 100vh;
            background-image: 
                radial-gradient(ellipse at 10% 20%, rgba(108, 92, 231, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 80%, rgba(236, 72, 153, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(0, 0, 0, 0.95) 0%, #0a0a0f 100%);
        }

        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-strong {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        header {
            padding: 1.2rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 10, 15, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #818cf8, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
            letter-spacing: -0.5px;
        }

        .logo span {
            font-weight: 400;
            background: none;
            -webkit-text-fill-color: rgba(255, 255, 255, 0.5);
        }

        .header-actions {
            display: flex;
            gap: 0.8rem;
            align-items: center;
        }

        .header-actions select {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #fff;
            padding: 0.5rem 1rem;
            border-radius: 12px;
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
            font-family: 'Inter', sans-serif;
        }

        .header-actions select option {
            background: #1a1a2e;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 1.5rem 2rem;
        }

        .search-section {
            padding: 2rem 0 1.5rem 0;
        }

        .search-bar {
            display: flex;
            gap: 0.8rem;
            max-width: 700px;
            margin: 0 auto;
            position: relative;
        }

        .search-bar input {
            flex: 1;
            padding: 1rem 1.5rem;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            color: #fff;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s;
        }

        .search-bar input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        .search-bar input:focus {
            outline: none;
            border-color: rgba(129, 140, 248, 0.4);
            background: rgba(255, 255, 255, 0.08);
        }

        .search-bar button {
            padding: 1rem 2rem;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, #818cf8, #6366f1);
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
        }

        .search-bar button:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 30px rgba(99, 102, 241, 0.3);
        }

        .source-tabs {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin-top: 1.2rem;
        }

        .source-tab {
            padding: 0.4rem 1.2rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }

        .source-tab.active {
            background: rgba(129, 140, 248, 0.15);
            border-color: rgba(129, 140, 248, 0.3);
            color: #818cf8;
        }

        .source-tab:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 2rem 0 1.5rem 0;
        }

        .section-title h2 {
            font-size: 1.2rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
        }

        .section-title .view-all {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: color 0.3s;
        }

        .section-title .view-all:hover {
            color: #818cf8;
        }

        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .anime-card {
            border-radius: 16px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .anime-card:hover {
            transform: translateY(-8px);
            border-color: rgba(129, 140, 248, 0.2);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .card-poster-wrap {
            position: relative;
            padding-top: 140%;
            overflow: hidden;
            background: #111;
        }

        .card-poster {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s;
        }

        .anime-card:hover .card-poster {
            transform: scale(1.05);
        }

        .card-episode-badge {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 0.2rem 0.7rem;
            border-radius: 8px;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .card-content {
            padding: 1rem;
        }

        .card-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: #fff;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.4;
            margin-bottom: 0.3rem;
        }

        .card-rating {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.8rem;
            color: #fbbf24;
            margin-top: 0.3rem;
        }

        .card-rating svg {
            width: 14px;
            height: 14px;
            fill: #fbbf24;
        }

        .card-meta {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 0.3rem;
        }

        .detail-screen {
            display: none;
            padding: 1rem 0;
        }

        .detail-back {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1.2rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .detail-back:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 2rem;
        }

        .detail-poster-wrap {
            border-radius: 16px;
            overflow: hidden;
            background: #111;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .detail-poster {
            width: 100%;
            display: block;
        }

        .detail-info h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.3rem;
        }

        .detail-info .orig-title {
            color: rgba(255, 255, 255, 0.4);
            font-size: 1rem;
            margin-bottom: 1rem;
        }

        .detail-rating {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .detail-rating-item {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .detail-rating-item .score {
            color: #fbbf24;
            font-weight: 600;
        }

        .detail-description {
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.7;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }

        .detail-meta {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 0.5rem 1.5rem;
            margin-bottom: 1.5rem;
        }

        .detail-meta-item {
            font-size: 0.85rem;
        }

        .detail-meta-item .label {
            color: rgba(255, 255, 255, 0.3);
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .detail-meta-item .value {
            color: rgba(255, 255, 255, 0.9);
        }

        .player-section {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .player-section h3 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .player-controls {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .player-controls select {
            padding: 0.6rem 1.2rem;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
            min-width: 200px;
        }

        .player-controls select option {
            background: #1a1a2e;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 16px;
            background: #000;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 2rem;
            padding: 1rem 0;
        }

        .pagination button {
            padding: 0.5rem 1.2rem;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
        }

        .pagination button:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }

        .pagination button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .loading-text, .empty-text {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.95rem;
        }

        @media (max-width: 768px) {
            header {
                padding: 0.8rem 1rem;
            }
            .logo {
                font-size: 1.4rem;
            }
            .container {
                padding: 1rem;
            }
            .search-bar {
                flex-direction: column;
            }
            .search-bar button {
                width: 100%;
                justify-content: center;
            }
            .detail-grid {
                grid-template-columns: 1fr;
            }
            .detail-poster-wrap {
                max-width: 250px;
                margin: 0 auto;
            }
            .anime-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 1rem;
            }
            .section-title h2 {
                font-size: 1rem;
            }
            .header-actions select {
                font-size: 0.7rem;
                padding: 0.3rem 0.6rem;
            }
        }

        @media (max-width: 480px) {
            .anime-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 0.8rem;
            }
            .card-content {
                padding: 0.6rem;
            }
            .card-title {
                font-size: 0.8rem;
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .player-error {
            display: none;
            padding: 3rem;
            text-align: center;
            background: rgba(255, 0, 0, 0.05);
            border-radius: 16px;
            border: 1px solid rgba(255, 0, 0, 0.1);
            color: rgba(255, 255, 255, 0.5);
        }

        .player-error .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo" id="logo">Anime<span>Glass</span></div>
        <div class="header-actions">
            <select id="source-select">
                <option value="kodik">Kodik</option>
                <option value="alloha">Alloha</option>
            </select>
        </div>
    </header>

    <div class="container">
        <!-- Каталог -->
        <div id="catalog-screen">
            <div class="search-section">
                <form id="search-form" class="search-bar">
                    <input type="text" id="search-input" placeholder="Поиск аниме...">
                    <button type="submit">Поиск</button>
                </form>
                <div class="source-tabs">
                    <span class="source-tab active">Видео</span>
                    <span class="source-tab">Kodik</span>
                    <span class="source-tab">Alloha</span>
                </div>
            </div>

            <div class="section-title">
                <h2 id="section-title">Недавно добавленные</h2>
                <span class="view-all">Смотреть все →</span>
            </div>

            <div class="anime-grid" id="anime-container">
                <div class="loading-text">Загрузка...</div>
            </div>

            <div class="pagination" id="pagination-controls">
                <button id="btn-prev" disabled>← Назад</button>
                <button id="btn-next">Вперед →</button>
            </div>
        </div>

        <!-- Детали -->
        <div id="detail-screen" class="detail-screen">
            <button class="detail-back" id="btn-back">← Назад к списку</button>
            
            <div class="detail-grid">
                <div class="detail-poster-wrap">
                    <img class="detail-poster" id="detail-poster" src="" alt="Постер">
                </div>
                <div class="detail-info">
                    <h1 id="detail-title"></h1>
                    <div class="orig-title" id="detail-orig-title"></div>
                    <div class="detail-rating" id="detail-ratings"></div>
                    <div class="detail-description" id="detail-description"></div>
                    <div class="detail-meta" id="detail-meta"></div>
                </div>
            </div>

            <div class="player-section">
                <h3>Смотреть онлайн</h3>
                <div class="player-controls">
                    <select id="voice-select">
                        <option value="">Выберите озвучку...</option>
                    </select>
                </div>
                <div class="video-container">
                    <iframe id="kodik-player" allowfullscreen></iframe>
                </div>
                <div class="player-error" id="player-error">
                    <div class="icon">🎬</div>
                    <div>Не удалось загрузить видео. Попробуйте выбрать другую озвучку.</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ========== КОНФИГУРАЦИЯ ==========
        const CONFIG = {
            API_URL: 'https://kodik-api.com',
            TOKEN: '1849e7b2339ee8eb64817452d3ef1d59',
            LIMIT: 20,
            CORS_PROXY: 'https://api.allorigins.win/raw?url='
        };

        // ========== СОСТОЯНИЕ ==========
        let state = {
            currentPage: 1,
            currentMode: 'list',
            searchQuery: '',
            filters: { kind: '', status: '', year: '' },
            currentAnimeList: [],
            rawAnimeData: [],
            currentAnimeId: null
        };

        // ========== DOM ==========
        const $ = id => document.getElementById(id);
        const dom = {
            logo: $('logo'),
            catalogScreen: $('catalog-screen'),
            detailScreen: $('detail-screen'),
            searchForm: $('search-form'),
            searchInput: $('search-input'),
            animeContainer: $('anime-container'),
            sectionTitle: $('section-title'),
            btnPrev: $('btn-prev'),
            btnNext: $('btn-next'),
            btnBack: $('btn-back'),
            detailPoster: $('detail-poster'),
            detailTitle: $('detail-title'),
            detailOrigTitle: $('detail-orig-title'),
            detailRatings: $('detail-ratings'),
            detailDescription: $('detail-description'),
            detailMeta: $('detail-meta'),
            voiceSelect: $('voice-select'),
            player: $('kodik-player'),
            playerError: $('player-error'),
            paginationControls: $('pagination-controls'),
            sourceSelect: $('source-select')
        };

        // ========== ЗАПУСК ==========
        init();

        function init() {
            loadAnimeData();
            setupEventListeners();
        }

        // ========== СОБЫТИЯ ==========
        function setupEventListeners() {
            dom.logo.addEventListener('click', () => {
                state.currentMode = 'list';
                state.currentPage = 1;
                dom.searchInput.value = '';
                loadAnimeData();
                showScreen('catalog');
            });

            dom.searchForm.addEventListener('submit', (e) => {
                e.preventDefault();
                state.currentMode = 'search';
                state.currentPage = 1;
                state.searchQuery = dom.searchInput.value.trim();
                loadAnimeData();
            });

            dom.btnPrev.addEventListener('click', () => {
                if (state.currentPage > 1) {
                    state.currentPage--;
                    loadAnimeData();
                }
            });

            dom.btnNext.addEventListener('click', () => {
                state.currentPage++;
                loadAnimeData();
            });

            dom.btnBack.addEventListener('click', () => {
                showScreen('catalog');
                dom.player.src = '';
            });

            dom.voiceSelect.addEventListener('change', (e) => {
                const url = e.target.value;
                if (url) {
                    playVideo(url);
                }
            });

            dom.sourceSelect.addEventListener('change', () => {
                if (state.currentAnimeId) {
                    loadAnimeDetails(state.currentAnimeId);
                }
            });
        }

        // ========== API ЗАПРОСЫ ==========
        async function fetchFromKodik(endpoint, params = {}) {
            const urlParams = new URLSearchParams({
                token: CONFIG.TOKEN,
                limit: CONFIG.LIMIT,
                with_material_data: 'true',
                ...params
            });
            const targetUrl = `${CONFIG.API_URL}${endpoint}?${urlParams.toString()}`;
            const finalUrl = CONFIG.CORS_PROXY + encodeURIComponent(targetUrl);
            
            const response = await fetch(finalUrl);
            if (!response.ok) throw new Error('Ошибка сети');
            return await response.json();
        }

        // ========== ЗАГРУЗКА ДАННЫХ ==========
        async function loadAnimeData() {
            dom.animeContainer.innerHTML = '<div class="loading-text">Загрузка...</div>';
            
            try {
                let data;
                let params = { page: state.currentPage };
                
                if (state.currentMode === 'list') {
                    dom.sectionTitle.textContent = 'Недавно добавленные';
                    params.types = 'anime-serial,anime';
                    data = await fetchFromKodik('/list', params);
                } else {
                    dom.sectionTitle.textContent = 'Результаты поиска';
                    if (state.searchQuery) params.title = state.searchQuery;
                    data = await fetchFromKodik('/search', params);
                }
                
                state.rawAnimeData = data.results || [];
                state.currentAnimeList = deduplicateAnime(state.rawAnimeData);
                renderCatalog();
                renderPagination(data.total);
            } catch (error) {
                console.error(error);
                dom.animeContainer.innerHTML = '<div class="empty-text">Ошибка загрузки данных</div>';
            }
        }

        function deduplicateAnime(results) {
            const seen = new Set();
            return results.filter(item => {
                const id = item.shikimori_id || item.id;
                if (seen.has(id)) return false;
                seen.add(id);
                return true;
            });
        }

        // ========== ОТРИСОВКА КАТАЛОГА ==========
        function renderCatalog() {
            dom.animeContainer.innerHTML = '';
            
            if (state.currentAnimeList.length === 0) {
                dom.animeContainer.innerHTML = '<div class="empty-text">Ничего не найдено</div>';
                return;
            }

            state.currentAnimeList.forEach(anime => {
                const mData = anime.material_data || {};
                const title = anime.title || mData.anime_title || 'Без названия';
                const poster = mData.poster_url || (anime.screenshots && anime.screenshots[0]) || '';
                const rating = mData.shikimori_rating || mData.kinopoisk_rating || null;
                const year = anime.year || mData.year || '';
                const kind = mData.anime_kind ? translateKind(mData.anime_kind) : '';
                
                const card = document.createElement('div');
                card.className = 'anime-card';
                card.innerHTML = `
                    <div class="card-poster-wrap">
                        <img class="card-poster" src="${poster || 'https://via.placeholder.com/200x280/1a1a2e/818cf8?text=No+Image'}" 
                             alt="${title}" loading="lazy"
                             onerror="this.src='https://via.placeholder.com/200x280/1a1a2e/818cf8?text=No+Image'">
                        ${anime.last_episode ? `<div class="card-episode-badge">${anime.last_episode} серий</div>` : ''}
                    </div>
                    <div class="card-content">
                        <div class="card-title">${title}</div>
                        ${rating ? `<div class="card-rating">★ ${rating}</div>` : ''}
                        <div class="card-meta">${year} ${kind ? '• ' + kind : ''}</div>
                    </div>
                `;
                
                card.addEventListener('click', () => {
                    const id = anime.shikimori_id || anime.id;
                    state.currentAnimeId = id;
                    loadAnimeDetails(id);
                });
                
                dom.animeContainer.appendChild(card);
            });
        }

        // ========== ДЕТАЛЬНАЯ СТРАНИЦА ==========
        async function loadAnimeDetails(uniqueId) {
            try {
                const variants = state.rawAnimeData.filter(item => 
                    (item.shikimori_id || item.id) == uniqueId
                );
                
                if (variants.length === 0) {
                    // Если данных нет, делаем новый запрос
                    const data = await fetchFromKodik('/search', { shikimori_id: uniqueId });
                    state.rawAnimeData = data.results || [];
                    const newVariants = state.rawAnimeData.filter(item => 
                        (item.shikimori_id || item.id) == uniqueId
                    );
                    if (newVariants.length === 0) return;
                    showAnimeDetails(newVariants);
                } else {
                    showAnimeDetails(variants);
                }
            } catch (error) {
                console.error('Ошибка загрузки деталей:', error);
            }
        }

        function showAnimeDetails(variants) {
            const primary = variants[0];
            const mData = primary.material_data || {};
            
            // Постер
            dom.detailPoster.src = mData.poster_url || (primary.screenshots && primary.screenshots[0]) || 
                                   'https://via.placeholder.com/280x400/1a1a2e/818cf8?text=No+Image';
            dom.detailPoster.onerror = function() {
                this.src = 'https://via.placeholder.com/280x400/1a1a2e/818cf8?text=No+Image';
            };
            
            // Название
            dom.detailTitle.textContent = primary.title || mData.anime_title || 'Без названия';
            dom.detailOrigTitle.textContent = primary.title_orig || mData.title_en || '';
            
            // Рейтинги
            const ratings = [];
            if (mData.shikimori_rating) ratings.push(`Shikimori: ${mData.shikimori_rating}`);
            if (mData.kinopoisk_rating) ratings.push(`Кинопоиск: ${mData.kinopoisk_rating}`);
            if (mData.imdb_rating) ratings.push(`IMDb: ${mData.imdb_rating}`);
            
            dom.detailRatings.innerHTML = ratings.map(r => 
                `<span class="detail-rating-item">★ <span class="score">${r}</span></span>`
            ).join('');
            
            // Описание
            dom.detailDescription.textContent = mData.description || 'Описание отсутствует.';
            
            // Мета-данные
            const metaData = [
                { label: 'Год', value: primary.year || mData.year || '-' },
                { label: 'Тип', value: translateKind(mData.anime_kind || '') },
                { label: 'Статус', value: translateStatus(mData.anime_status || '') },
                { label: 'Жанры', value: (mData.anime_genres || []).join(', ') || '-' },
                { label: 'Студия', value: (mData.anime_studios || []).join(', ') || '-' }
            ];
            
            dom.detailMeta.innerHTML = metaData.map(item => `
                <div class="detail-meta-item">
                    <span class="label">${item.label}</span>
                    <span class="value">${item.value}</span>
                </div>
            `).join('');
            
            // Озвучки
            dom.voiceSelect.innerHTML = '<option value="">Выберите озвучку...</option>';
            
            variants.forEach(variant => {
                const opt = document.createElement('option');
                const episodes = variant.last_episode ? ` (${variant.last_episode} серий)` : '';
                opt.textContent = `${variant.translation.title}${episodes}`;
                opt.value = variant.link;
                dom.voiceSelect.appendChild(opt);
            });
            
            // Автоматически выбираем первую озвучку
            if (variants.length > 0) {
                const firstLink = variants[0].link;
                dom.voiceSelect.value = firstLink;
                playVideo(firstLink);
            }
            
            showScreen('detail');
        }

        // ========== ПЛЕЕР ==========
        function playVideo(link) {
            dom.playerError.style.display = 'none';
            
            if (!link) {
                dom.playerError.style.display = 'block';
                dom.player.src = '';
                return;
            }
            
            // Преобразуем ссылку для правильной работы плеера
            let playerUrl = link;
            
            // Если ссылка начинается с //, добавляем https:
            if (playerUrl.startsWith('//')) {
                playerUrl = 'https:' + playerUrl;
            }
            
            // Если это ссылка на сериал, добавляем параметры для плеера
            if (playerUrl.includes('/serial/') && !playerUrl.includes('?')) {
                playerUrl += '?player=1&series=1';
            }
            
            // Если это ссылка на видео, добавляем параметр
            if (playerUrl.includes('/video/') && !playerUrl.includes('?')) {
                playerUrl += '?player=1';
            }
            
            // Добавляем параметр для переключения источника
            const source = dom.sourceSelect.value;
            if (!playerUrl.includes('source=')) {
                playerUrl += (playerUrl.includes('?') ? '&' : '?') + 'source=' + source;
            }
            
            console.log('Загрузка плеера:', playerUrl);
            dom.player.src = playerUrl;
            
            // Обработчик ошибок плеера
            dom.player.onerror = function() {
                dom.playerError.style.display = 'block';
                dom.player.src = '';
            };
            
            // Таймаут, если плеер не загружается
            setTimeout(() => {
                if (!dom.player.src) {
                    dom.playerError.style.display = 'block';
                }
            }, 10000);
        }

        // ========== УПРАВЛЕНИЕ ЭКРАНАМИ ==========
        function showScreen(screen) {
            if (screen === 'catalog') {
                dom.catalogScreen.style.display = 'block';
                dom.detailScreen.style.display = 'none';
                dom.player.src = '';
                document.body.style.overflow = 'auto';
            } else {
                dom.catalogScreen.style.display = 'none';
                dom.detailScreen.style.display = 'block';
                document.body.style.overflow = 'auto';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }
