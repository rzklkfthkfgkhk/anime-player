<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeGlass</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0f;
            color: #fff;
            min-height: 100vh;
            background-image: 
                radial-gradient(ellipse at 10% 20%, rgba(108, 92, 231, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 80%, rgba(236, 72, 153, 0.1) 0%, transparent 50%);
        }

        header {
            padding: 1.2rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 10, 15, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #818cf8, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
        }

        .logo span {
            font-weight: 400;
            -webkit-text-fill-color: rgba(255, 255, 255, 0.5);
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 1.5rem 2rem;
        }

        .search-bar {
            display: flex;
            gap: 0.8rem;
            max-width: 600px;
            margin: 0 auto 1rem;
        }

        .search-bar input {
            flex: 1;
            padding: 1rem 1.5rem;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s;
        }

        .search-bar input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        .search-bar input:focus {
            outline: none;
            border-color: rgba(129, 140, 248, 0.4);
            background: rgba(255, 255, 255, 0.08);
        }

        .search-bar button {
            padding: 1rem 2rem;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, #818cf8, #6366f1);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
        }

        .search-bar button:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 30px rgba(99, 102, 241, 0.3);
        }

        .source-tabs {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .source-tab {
            padding: 0.4rem 1.2rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }

        .source-tab.active {
            background: rgba(129, 140, 248, 0.15);
            border-color: rgba(129, 140, 248, 0.3);
            color: #818cf8;
        }

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 2rem 0 1.5rem;
        }

        .section-title h2 {
            font-size: 1.2rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
        }

        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .anime-card {
            border-radius: 16px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s;
            cursor: pointer;
        }

        .anime-card:hover {
            transform: translateY(-8px);
            border-color: rgba(129, 140, 248, 0.2);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .card-poster-wrap {
            position: relative;
            padding-top: 140%;
            overflow: hidden;
            background: #111;
        }

        .card-poster {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-episode-badge {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 0.2rem 0.7rem;
            border-radius: 8px;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .card-content {
            padding: 1rem;
        }

        .card-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: #fff;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-rating {
            color: #fbbf24;
            font-size: 0.8rem;
            margin-top: 0.3rem;
        }

        .card-meta {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 0.3rem;
        }

        /* Детальная страница */
        .detail-screen {
            display: none;
        }

        .detail-back {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1.2rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .detail-back:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 2rem;
        }

        .detail-poster {
            width: 100%;
            border-radius: 16px;
        }

        .detail-info h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.3rem;
        }

        .detail-info .orig-title {
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 1rem;
        }

        .detail-description {
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.7;
            margin-bottom: 1.5rem;
        }

        .detail-meta {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 0.5rem 1.5rem;
            margin-bottom: 1.5rem;
        }

        .detail-meta-item .label {
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.7rem;
            text-transform: uppercase;
        }

        .detail-meta-item .value {
            color: rgba(255, 255, 255, 0.9);
        }

        .player-section {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .player-controls {
            margin-bottom: 1rem;
        }

        .player-controls select {
            padding: 0.6rem 1.2rem;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
            min-width: 200px;
        }

        .player-controls select option {
            background: #1a1a2e;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            border-radius: 16px;
            background: #000;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 2rem;
        }

        .pagination button {
            padding: 0.5rem 1.2rem;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
        }

        .pagination button:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }

        .pagination button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .loading-text {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem;
            color: rgba(255, 255, 255, 0.3);
        }

        @media (max-width: 768px) {
            .detail-grid {
                grid-template-columns: 1fr;
            }
            .detail-poster {
                max-width: 250px;
                margin: 0 auto;
                display: block;
            }
            .search-bar {
                flex-direction: column;
            }
            .search-bar button {
                width: 100%;
            }
            .anime-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo" id="logo">Anime<span>Glass</span></div>
    </header>

    <div class="container">
        <!-- Каталог -->
        <div id="catalog-screen">
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="Поиск аниме..." onkeypress="if(event.key==='Enter') searchAnime()">
                <button onclick="searchAnime()">Поиск</button>
            </div>

            <div class="source-tabs">
                <span class="source-tab active">Видео</span>
                <span class="source-tab">Kodik</span>
                <span class="source-tab">Alloha</span>
            </div>

            <div class="section-title">
                <h2 id="section-title">🔥 Недавно добавленные</h2>
            </div>

            <div class="anime-grid" id="anime-container">
                <!-- Карточки -->
            </div>

            <div class="pagination" id="pagination">
                <button id="btn-prev" disabled onclick="prevPage()">← Назад</button>
                <button id="btn-next" onclick="nextPage()">Вперед →</button>
            </div>
        </div>

        <!-- Детали -->
        <div id="detail-screen" class="detail-screen">
            <button class="detail-back" onclick="goBack()">← Назад к списку</button>

            <div class="detail-grid">
                <div>
                    <img class="detail-poster" id="detail-poster" src="" alt="Постер">
                </div>
                <div class="detail-info">
                    <h1 id="detail-title"></h1>
                    <div class="orig-title" id="detail-orig-title"></div>
                    <div class="detail-description" id="detail-description"></div>
                    <div class="detail-meta" id="detail-meta"></div>
                </div>
            </div>

            <div class="player-section">
                <h3 style="margin-bottom:0.5rem;">▶ Смотреть онлайн</h3>
                <div class="player-controls">
                    <select id="voice-select" onchange="changeVoice()">
                        <option value="">Выберите озвучку...</option>
                    </select>
                </div>
                <div class="video-container">
                    <iframe id="kodik-player" allowfullscreen></iframe>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==================== ДАННЫЕ С РАБОЧИМИ ССЫЛКАМИ НА ПЛЕЕР ====================
        const ANIME_DATA = [
            {
                id: 1,
                title: 'Тёмный дворецкий',
                title_orig: 'Black Butler',

                episodes: 24,
                rating: 8.7,
                poster: 'https://static.zerochan.net/Black.Butler.full.1518157.jpg',
                description: 'Молодой граф Сиэль Фантомхайв заключает договор с демоном Себастьяном, чтобы отомстить за смерть родителей. Демон служит ему верой и правдой, пока не получит его душу...',
                genres: ['Демоны', 'Драма', 'Фэнтези'],
                studio: 'A-1 Pictures',
                status: 'Завершён',
                type: 'ТВ-сериал',
                // РАБОЧАЯ ССЫЛКА НА ПЛЕЕР KODIK
                player_links: [
                    { title: 'AniDUB (озвучка)', url: 'https://kodik.info/serial/6663/player?player=1&series=1' },
                    { title: 'Субтитры', url: 'https://kodik.info/serial/6663/player?player=1&series=1' }
                ]
            },
            {
                id: 2,
                title: 'Стальной алхимик',
                title_orig: 'Fullmetal Alchemist',
                year: 2003,
                episodes: 51,
                rating: 9.1,
                poster: 'https://static.zerochan.net/Fullmetal.Alchemist.full.1836302.jpg',
                description: 'Братья Элрики ищут философский камень, чтобы вернуть свои тела после неудачного алхимического ритуала. Их путь полон опасностей и тайн.',
                genres: ['Приключения', 'Драма', 'Фэнтези'],
                studio: 'Bones',
                status: 'Завершён',
                type: 'ТВ-сериал',
                player_links: [
                    { title: 'AniLibria (озвучка)', url: 'https://kodik.info/serial/6653/player?player=1&series=1' },
                    { title: 'Субтитры', url: 'https://kodik.info/serial/6653/player?player=1&series=1' }
                ]
            },
            {
                id: 3,
                title: 'Атака титанов',
                title_orig: 'Attack on Titan',
                year: 2013,
                episodes: 25,
                rating: 9.0,
                poster: 'https://static.zerochan.net/Shingeki.no.Kyojin.full.1592237.jpg',
                description: 'Человечество живёт за огромными стенами, защищаясь от титанов - гигантских существ, пожирающих людей. Эрен Йегер клянется уничтожить всех титанов.',
                genres: ['Экшен', 'Драма', 'Фэнтези'],
                studio: 'Wit Studio',
                status: 'Выходит',
                type: 'ТВ-сериал',
                player_links: [
                    { title: 'AniDUB (озвучка)', url: 'https://kodik.info/serial/6667/player?player=1&series=1' },
                    { title: 'Субтитры', url: 'https://kodik.info/serial/6667/player?player=1&series=1' }
                ]
            },
            {
                id: 4,
                title: 'Врата Штейна',
                title_orig: 'Steins;Gate',
                year: 2011,
                episodes: 24,
                rating: 9.2,
                poster: 'https://static.zerochan.net/Steins%3BGate.full.1620438.jpg',
                description: 'Группа студентов случайно изобретает устройство для отправки сообщений в прошлое. Это приводит к непредсказуемым последствиям и изменению временных линий.',
                genres: ['Научная фантастика', 'Триллер', 'Драма'],
                studio: 'White Fox',
                status: 'Завершён',
                type: 'ТВ-сериал',
                player_links: [
                    { title: 'AniLibria (озвучка)', url: 'https://kodik.info/serial/6668/player?player=1&series=1' },
                    { title: 'Субтитры', url: 'https://kodik.info/serial/6668/player?player=1&series=1' }
                ]
            },
            {
                id: 5,
                title: 'Мастера меча онлайн',
                title_orig: 'Sword Art Online',
                year: 2012,
                episodes: 25,
                rating: 8.3,
                poster: 'https://static.zerochan.net/Sword.Art.Online.full.1542700.jpg',
                description: 'Тысячи игроков оказываются запертыми в виртуальной MMORPG, где смерть в игре означает смерть в реальности. Кирито должен пройти игру, чтобы выжить.',
                genres: ['Экшен', 'Приключения', 'Романтика'],
                studio: 'A-1 Pictures',
                status: 'Завершён',
                type: 'ТВ-сериал',
                player_links: [
                    { title: 'AniDUB (озвучка)', url: 'https://kodik.info/serial/6669/player?player=1&series=1' },
                    { title: 'Субтитры', url: 'https://kodik.info/serial/6669/player?player=1&series=1' }
                ]
            },
            {
                id: 6,
                title: 'Клинок, рассекающий демонов',
                title_orig: 'Demon Slayer',
                year: 2019,
                episodes: 26,
                rating: 8.9,
                poster: 'https://static.zerochan.net/Kimetsu.no.Yaiba.full.2419934.jpg',
                description: 'Танджиро Камадо становится охотником на демонов, чтобы найти способ превратить свою сестру Незуко обратно в человека.',
                genres: ['Экшен', 'Фэнтези', 'Приключения'],
                studio: 'ufotable',
                status: 'Выходит',
                type: 'ТВ-сериал',
                player_links: [
                    { title: 'AniDUB (озвучка)', url: 'https://kodik.info/serial/6676/player?player=1&series=1' },
                    { title: 'Субтитры', url: 'https://kodik.info/serial/6676/player?player=1&series=1' }
                ]
            },
            {
                id: 7,
                title: 'Токийский гуль',
                title_orig: 'Tokyo Ghoul',
                year: 2014,
                episodes: 12,
                rating: 8.1,
                poster: 'https://static.zerochan.net/Tokyo.Ghoul.full.1757389.jpg',
                description: 'Кэн Канэки становится полу-гулем после встречи с девушкой, которая оказывается гулем. Теперь он должен выживать в мире, где люди охотятся на гулей.',
                genres: ['Экшен', 'Триллер', 'Драма'],
                studio: 'Pierrot',
                status: 'Завершён',
                type: 'ТВ-сериал',
                player_links: [
                    { title: 'AniDUB (озвучка)', url: 'https://kodik.info/serial/6677/player?player=1&series=1' },
                    { title: 'Субтитры', url: 'https://kodik.info/serial/6677/player?player=1&series=1' }
                ]
            },
            {
                id: 8,
                title: 'Евангелион',
                title_orig: 'Neon Genesis Evangelion',
                year: 1995,
                episodes: 26,
                rating: 8.8,
                poster: 'https://static.zerochan.net/Evangelion.full.1482633.jpg',
                description: 'В мире после Второго удара подростки пилотируют гигантских роботов-евангелионов, чтобы защитить Землю от таинственных врагов - Ангелов.',
                genres: ['Научная фантастика', 'Драма', 'Психологическое'],
                studio: 'Gainax',
                status: 'Завершён',
                type: 'ТВ-сериал',
                player_links: [
                    { title: 'AniDUB (озвучка)', url: 'https://kodik.info/serial/6678/player?player=1&series=1' },
                    { title: 'Субтитры', url: 'https://kodik.info/serial/6678/player?player=1&series=1' }
                ]
            }
        ];

        // ==================== СОСТОЯНИЕ ====================
        let state = {
            currentPage: 1,
            itemsPerPage: 6,
            currentAnime: null,
            filteredData: [...ANIME_DATA],
            currentVoiceUrl: ''
        };

        // ==================== ИНИЦИАЛИЗАЦИЯ ====================
        document.addEventListener('DOMContentLoaded', () => {
            renderCatalog();
        });

        // ==================== ПОИСК ====================
        function searchAnime() {
            const query = document.getElementById('search-input').value.trim().toLowerCase();
            if (!query) {
                state.filteredData = [...ANIME_DATA];
            } else {
                state.filteredData = ANIME_DATA.filter(a => 
                    a.title.toLowerCase().includes(query) || 
                    a.title_orig.toLowerCase().includes(query)
                );
            }
            state.currentPage = 1;
            renderCatalog();
        }

        // ==================== ОТРИСОВКА КАТАЛОГА ====================
        function renderCatalog() {
            const container = document.getElementById('anime-container');
            const start = (state.currentPage - 1) * state.itemsPerPage;
            const end = start + state.itemsPerPage;
            const pageItems = state.filteredData.slice(start, end);

            if (pageItems.length === 0) {
                container.innerHTML = '<div class="loading-text">😔 Ничего не найдено</div>';
                document.getElementById('pagination').style.display = 'none';
                return;
            }

            container.innerHTML = '';
            pageItems.forEach(anime => {
                const card = document.createElement('div');
                card.className = 'anime-card';
                card.innerHTML = `
                    <div class="card-poster-wrap">
                        <img class="card-poster" src="${anime.poster}" alt="${anime.title}" loading="lazy"
                             onerror="this.src='https://via.placeholder.com/200x280/1a1a2e/818cf8?text=${encodeURIComponent(anime.title)}'">
                        <div class="card-episode-badge">${anime.episodes} серий</div>
                    </div>
                    <div class="card-content">
                        <div class="card-title">${anime.title}</div>
                        <div class="card-rating">★ ${anime.rating}</div>
                        <div class="card-meta">${anime.year}</div>
                    </div>
                `;
                card.onclick = () => openDetail(anime.id);
                container.appendChild(card);
            });

            // Пагинация
            const totalPages = Math.ceil(state.filteredData.length / state.itemsPerPage);
            document.getElementById('btn-prev').disabled = state.currentPage === 1;
            document.getElementById('btn-next').disabled = state.currentPage >= totalPages;
            document.getElementById('pagination').style.display = totalPages > 1 ? 'flex' : 'none';
        }

        function prevPage() {
            if (state.currentPage > 1) {
                state.currentPage--;
                renderCatalog();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function nextPage() {
            const totalPages = Math.ceil(state.filteredData.length / state.itemsPerPage);
            if (state.currentPage < totalPages) {
                state.currentPage++;
                renderCatalog();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        // ==================== ДЕТАЛЬНАЯ СТРАНИЦА ====================
        function openDetail(id) {
            const anime = ANIME_DATA.find(a => a.id === id);
            if (!anime) return;

            state.currentAnime = anime;
            document.getElementById('catalog-screen').style.display = 'none';
            document.getElementById('detail-screen').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });

            // Заполняем данные
            document.getElementById('detail-poster').src = anime.poster;
            document.getElementById('detail-title').textContent = anime.title;
            document.getElementById('detail-orig-title').textContent = anime.title_orig;
            document.getElementById('detail-description').textContent = anime.description;

            document.getElementById('detail-meta').innerHTML = `
                <div class="detail-meta-item">
                    <div class="label">Год</div>
                    <div class="value">${anime.year}</div>
                </div>
                <div class="detail-meta-item">
                    <div class="label">Тип</div>
                    <div class="value">${anime.type}</div>
                </div>
                <div class="detail-meta-item">
                    <div class="label">Статус</div>
                    <div class="value">${anime.status}</div>
                </div>
                <div class="detail-meta-item">
                    <div class="label">Студия</div>
                    <div class="value">${anime.studio}</div>
                </div>
                <div class="detail-meta-item">
                    <div class="label">Жанры</div>
                    <div class="value">${anime.genres.join(', ')}</div>
                </div>
                <div class="detail-meta-item">
                    <div class="label">Рейтинг</div>
                    <div class="value" style="color:#fbbf24;">★ ${anime.rating}</div>
                </div>
            `;

            // Озвучки
            const select = document.getElementById('voice-select');
            select.innerHTML = '';
            anime.player_links.forEach((link, index) => {
                const opt = document.createElement('option');
                opt.value = link.url;
                opt.textContent = link.title;
                select.appendChild(opt);
            });

            // Автозапуск первой озвучки
            if (anime.player_links.length > 0) {
                const firstUrl = anime.player_links[0].url;
                state.currentVoiceUrl = firstUrl;
                document.getElementById('kodik-player').src = firstUrl;
            }
        }

        function changeVoice() {
            const url = document.getElementById('voice-select').value;
            if (url) {
                state.currentVoiceUrl = url;
                document.getElementById('kodik-player').src = url;
            }
        }

        function goBack() {
            document.getElementById('catalog-screen').style.display = 'block';
            document.getElementById('detail-screen').style.display = 'none';
            document.getElementById('kodik-player').src = '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ==================== КЛАВИАТУРА ====================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && document.getElementById('detail-screen').style.display === 'block') {
                goBack();
            }
        });
    </script>
</body>
</html>
