<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeGlass</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
        body{background:#0d0f14;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;color:#fff}
        .app{max-width:1200px;width:100%;background:rgba(255,255,255,0.05);border-radius:30px;padding:30px;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.05)}
        .header{display:flex;flex-wrap:wrap;justify-content:space-between;gap:15px;margin-bottom:25px}
        .logo{font-size:28px;font-weight:700;background:linear-gradient(135deg,#6b8cff,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
        .search{flex:1;min-width:150px;padding:10px 20px;border-radius:50px;border:1px solid rgba(255,255,255,0.1);background:rgba(0,0,0,0.3);color:#fff;font-size:14px}
        .search::placeholder{color:#888}
        .player-box{background:rgba(0,0,0,0.3);border-radius:20px;padding:15px;margin-bottom:20px}
        .tabs{display:flex;gap:10px;margin-bottom:15px}
        .tab{padding:8px 25px;border-radius:30px;border:none;background:rgba(255,255,255,0.05);color:#aaa;cursor:pointer;font-size:14px;transition:0.3s}
        .tab:hover{background:rgba(255,255,255,0.1)}
        .tab.active{background:rgba(100,150,255,0.2);color:#fff}
        .player{width:100%;aspect-ratio:16/9;background:#000;border-radius:15px;overflow:hidden;position:relative}
        .player iframe{width:100%;height:100%;border:0}
        .player .info{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#666;font-size:16px;text-align:center}
        .anime-info{margin-top:15px}
        .anime-title{font-size:24px;font-weight:600;background:linear-gradient(135deg,#fff,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
        .anime-rating{color:#fbbf24;margin-left:10px;font-size:18px}
        .anime-desc{color:#aaa;margin-top:5px;font-size:14px;line-height:1.6}
        .episodes{margin-top:20px}
        .ep-label{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;color:#ccc;font-size:16px}
        .ep-label select{padding:8px 15px;border-radius:30px;border:1px solid rgba(255,255,255,0.1);background:rgba(0,0,0,0.4);color:#fff;font-size:14px}
        .ep-grid{display:flex;flex-wrap:wrap;gap:8px}
        .ep-btn{padding:8px 16px;border-radius:12px;border:1px solid rgba(255,255,255,0.05);background:rgba(255,255,255,0.03);color:#ccc;cursor:pointer;font-size:14px;transition:0.3s;min-width:40px;text-align:center}
        .ep-btn:hover{background:rgba(100,150,255,0.15);color:#fff}
        .ep-btn.active{background:rgba(100,150,255,0.25);border-color:rgba(100,150,255,0.3);color:#fff}
        .footer{text-align:right;margin-top:15px;color:#555;font-size:12px}
        @media(max-width:600px){.app{padding:15px}.logo{font-size:22px}.anime-title{font-size:20px}.ep-btn{padding:6px 12px;font-size:12px}}
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <div class="logo">✦ AnimeGlass</div>
        <input class="search" type="text" placeholder="Поиск аниме..." id="search">
    </div>

    <div class="player-box">
        <div class="tabs">
            <button class="tab active" data-player="kodik">📺 Kodik</button>
            <button class="tab" data-player="alloha">🎞️ Alloha</button>
        </div>
        <div class="player" id="player">
            <div class="info" id="placeholder">📺 Выберите аниме и серию</div>
            <iframe id="iframe" src="" style="display:none"></iframe>
        </div>
        <div class="anime-info">
            <div class="anime-title" id="title">Тёмный дворецкий</div>
            <span class="anime-rating" id="rating">★ 8.7</span>
            <div class="anime-desc" id="desc">Молодой граф Сиэль Фантомхайв заключает контракт с демоном, чтобы отомстить за гибель семьи.</div>
        </div>
    </div>

    <div class="episodes">
        <div class="ep-label">
            <span>📋 Список серий</span>
            <span id="count">1–12</span>
            <select id="animeList">
                <option value="0">Тёмный дворецкий</option>
                <option value="1">Наруто</option>
                <option value="2">Атака Титанов</option>
                <option value="3">Ван-Пис</option>
                <option value="4">Магическая битва</option>
                <option value="5">Клинок, рассекающий демонов</option>
            </select>
        </div>
        <div class="ep-grid" id="epGrid"></div>
    </div>
    <div class="footer">• плеер запоминает выбор •</div>
</div>

<script>
// БАЗА АНИМЕ
const ANIME = [
    {id:0,title:"Тёмный дворецкий",rating:"8.7",desc:"Молодой граф Сиэль Фантомхайв заключает контракт с демоном.",kodik:"40589",alloha:"256",eps:12},
    {id:1,title:"Наруто",rating:"8.5",desc:"История о юном ниндзя Наруто Узумаки.",kodik:"10",alloha:"10",eps:220},
    {id:2,title:"Атака Титанов",rating:"9.0",desc:"Человечество живёт за стенами, спасаясь от Титанов.",kodik:"246",alloha:"246",eps:87},
    {id:3,title:"Ван-Пис",rating:"9.2",desc:"Пират Монки Д. Луффи ищет легендарное сокровище.",kodik:"5",alloha:"5",eps:1100},
    {id:4,title:"Магическая битва",rating:"8.9",desc:"Юдзи Итадори становится вместилищем демона Сукуны.",kodik:"38289",alloha:"38289",eps:24},
    {id:5,title:"Клинок, рассекающий демонов",rating:"9.1",desc:"Тандзиро Камадо охотится на демонов.",kodik:"40590",alloha:"40590",eps:44}
];

// DOM
const iframe = document.getElementById('iframe');
const placeholder = document.getElementById('placeholder');
const tabs = document.querySelectorAll('.tab');
const epGrid = document.getElementById('epGrid');
const animeList = document.getElementById('animeList');
const title = document.getElementById('title');
const rating = document.getElementById('rating');
const desc = document.getElementById('desc');
const count = document.getElementById('count');
const search = document.getElementById('search');

let source = 'kodik';
let episode = 1;
let animeId = 0;

function getAnime(){ return ANIME[animeId] || ANIME[0]; }

function updateInfo(){
    const a = getAnime();
    title.textContent = a.title;
    rating.textContent = '★ ' + a.rating;
    desc.textContent = a.desc;
    count.textContent = '1–' + a.eps;
    document.title = 'AnimeGlass · ' + a.title;
    animeList.value = animeId;
}

function buildEpisodes(){
    const a = getAnime();
    epGrid.innerHTML = '';
    const total = Math.min(a.eps, 50);
    for(let i=1; i<=total; i++){
        const btn = document.createElement('button');
        btn.className = 'ep-btn';
        if(i===episode) btn.classList.add('active');
        btn.textContent = i;
        btn.onclick = function(){
            episode = i;
            localStorage.setItem('ep', episode);
            document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            play();
        };
        epGrid.appendChild(btn);
    }
    if(a.eps > 50){
        const more = document.createElement('button');
        more.className = 'ep-btn';
        more.textContent = '...';
        more.onclick = function(){ alert('Всего ' + a.eps + ' серий'); };
        epGrid.appendChild(more);
    }
}

function play(){
    const a = getAnime();
    let url = '';
    if(source === 'kodik'){
        url = 'https://kodik.info/series/' + a.kodik + '/' + episode + '/';
    } else {
        url = 'https://alloha.app/embed/' + a.alloha + '/?ep=' + episode;
    }
    iframe.src = url;
    iframe.style.display = 'block';
    placeholder.style.display = 'none';
    console.log('▶️ ' + source + ' | ' + a.title + ' | серия ' + episode + ' → ' + url);
}

function init(){
    // Загрузка сохранений
    const s = localStorage.getItem('source');
    if(s==='alloha' || s==='kodik'){ source=s; }
    const e = localStorage.getItem('ep');
    if(e){ const ep=parseInt(e); if(ep>0){ episode=ep; } }
    const ai = localStorage.getItem('anime');
    if(ai){ const id=parseInt(ai); if(id>=0 && id<ANIME.length){ animeId=id; animeList.value=id; } }

    // Обновляем интерфейс
    tabs.forEach(tab => {
        tab.classList.remove('active');
        if(tab.dataset.player === source) tab.classList.add('active');
        tab.onclick = function(){
            tabs.forEach(t => t.classList.remove('active'));
            this.classList.add('active');
            source = this.dataset.player;
            localStorage.setItem('source', source);
            play();
        };
    });

    animeList.onchange = function(){
        const id = parseInt(this.value);
        if(id>=0 && id<ANIME.length){
            animeId = id;
            localStorage.setItem('anime', animeId);
            const a = getAnime();
            if(episode > a.eps){ episode = 1; localStorage.setItem('ep', episode); }
            updateInfo();
            buildEpisodes();
            play();
        }
    };

    search.oninput = function(){
        const q = this.value.toLowerCase().trim();
        const options = animeList.options;
        for(let i=0; i<options.length; i++){
            options[i].style.display = options[i].textContent.toLowerCase().includes(q) ? '' : 'none';
        }
    };

    updateInfo();
    buildEpisodes();
    play();
}

init();
</script>
</body>
</html>
