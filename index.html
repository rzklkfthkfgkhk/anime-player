<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimePortal - Просмотр Аниме</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --surface-color: #1f2833;
            --primary-color: #66fcf1;
            --text-color: #c5c6c7;
            --text-bright: #ffffff;
            --accent-color: #45a29e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            background-color: var(--surface-color);
            padding: 1rem 2rem;
            border-bottom: 2px solid var(--primary-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            color: var(--primary-color);
            cursor: pointer;
            font-size: 1.8rem;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        /* Форма поиска и фильтров */
        .search-section {
            background-color: var(--surface-color);
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .search-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .search-bar input {
            flex: 1;
            padding: 0.75rem;
            border-radius: 4px;
            border: 1px solid var(--accent-color);
            background: #0b0c10;
            color: var(--text-bright);
            font-size: 1rem;
        }

        button {
            padding: 0.75rem 1.5rem;
            background-color: var(--primary-color);
            color: var(--bg-color);
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-color);
            color: var(--text-bright);
        }

        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .filters select {
            padding: 0.5rem;
            border-radius: 4px;
            background: #0b0c10;
            color: var(--text-color);
            border: 1px solid var(--accent-color);
        }

        /* Сетка результатов */
        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .anime-card {
            background-color: var(--surface-color);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }

        .anime-card:hover {
            transform: translateY(-5px);
        }

        .card-poster {
            width: 100%;
            height: 310px;
            object-fit: cover;
            background-color: #111;
        }

        .card-content {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .card-title {
            color: var(--text-bright);
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 3.2rem;
        }

        .card-info {
            font-size: 0.85rem;
            margin-bottom: 1rem;
            color: #959697;
        }

        .card-rating {
            display: inline-block;
            background: #e67e22;
            color: #fff;
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            font-weight: bold;
            margin-bottom: 0.5rem;
            align-self: flex-start;
        }

        .card-content button {
            margin-top: auto;
            width: 100%;
        }

        /* Детальная страница */
        .detail-page {
            display: none;
            background-color: var(--surface-color);
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .detail-header {
            display: flex;
            gap: 2rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .detail-poster {
            width: 250px;
            border-radius: 4px;
            object-fit: cover;
        }

        .detail-info {
            flex: 1;
            min-width: 300px;
        }

        .detail-info h2 {
            color: var(--text-bright);
            margin-bottom: 1rem;
        }

        .detail-meta-item {
            margin-bottom: 0.5rem;
        }

        .detail-meta-item strong {
            color: var(--primary-color);
        }

        .player-section {
            margin-top: 2rem;
            border-top: 1px solid var(--accent-color);
            padding-top: 2rem;
        }

        .translation-selector {
            margin-bottom: 1rem;
        }

        .translation-selector select {
            padding: 0.5rem;
            width: 100%;
            max-width: 400px;
            background: #0b0c10;
            color: var(--text-bright);
            border: 1px solid var(--primary-color);
            border-radius: 4px;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Пагинация */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
        }

        .hidden {
            display: none !important;
        }

        .error-message {
            grid-column: 1 / -1;
            text-align: center;
            padding: 2rem;
            font-size: 1.2rem;
            color: var(--accent-color);
        }

        @media (max-width: 768px) {
            .detail-header {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1 id="logo">AnimePortal</h1>
    </header>

    <div class="container">
        <!-- Главный экран каталога -->
        <div id="catalog-screen">
            <section class="search-section">
                <form id="search-form">
                    <div class="search-bar">
                        <input type="text" id="search-input" placeholder="Введите название аниме (на русском или английском)...">
                        <button type="submit">Поиск</button>
                    </div>
                    <div class="filters">
                        <select id="filter-kind">
                            <option value="">Все типы</option>
                            <option value="tv">ТВ-сериал</option>
                            <option value="movie">Фильм</option>
                            <option value="ova">OVA</option>
                            <option value="ona">ONA</option>
                            <option value="special">Спецвыпуск</option>
                        </select>
                        <select id="filter-status">
                            <option value="">Все статусы</option>
                            <option value="released">Вышло</option>
                            <option value="ongoing">Выходит</option>
                            <option value="anons">Анонсировано</option>
                        </select>
                        <select id="filter-year">
                            <option value="">Все года</option>
                            <!-- Будет заполнено через JS -->
                        </select>
                    </div>
                </form>
            </section>

            <h2 id="section-title" style="margin-bottom: 1.5rem; color: var(--text-bright);">Недавно добавленные</h2>
            
            <div class="anime-grid" id="anime-container">
                <!-- Карточки загружаются динамически -->
            </div>

            <div class="pagination" id="pagination-controls">
                <button id="btn-prev" disabled>Назад</button>
                <button id="btn-next">Вперед</button>
            </div>
        </div>

        <!-- Экран детальной информации -->
        <div id="detail-screen" class="detail-page">
            <button id="btn-back" style="margin-bottom: 1.5rem;">← Назад к списку</button>
            <div class="detail-header" id="detail-header-content">
                <!-- Контент генерируется через JS -->
            </div>
            <div class="player-section">
                <h3 style="margin-bottom: 1rem; color: var(--text-bright);">Просмотр онлайн</h3>
                <div class="translation-selector">
                    <label for="voice-select" style="display:block; margin-bottom:0.5rem;">Выберите озвучку / перевод:</label>
                    <select id="voice-select">
                        <!-- Опции озвучек -->
                    </select>
                </div>
                <div class="video-container">
