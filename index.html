<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Смотреть аниме — Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0a0a0f; color: #fff; }
        .navbar { background: #14141e; padding: 15px 30px; display: flex; align-items: center; gap: 20px; border-bottom: 1px solid #2a2a3a; flex-wrap: wrap; }
        .navbar a { color: #e94560; text-decoration: none; font-weight: bold; font-size: 1.5rem; }
        .navbar span { color: #888; font-size: 0.9rem; }
        .player-wrapper { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 15px; background: #000; box-shadow: 0 20px 60px rgba(233, 69, 96, 0.2); }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .controls { margin-top: 25px; display: flex; flex-wrap: wrap; gap: 15px; align-items: center; background: #14141e; padding: 15px 25px; border-radius: 15px; }
        .controls label { color: #aaa; font-size: 0.9rem; }
        .controls select { background: #1e1e2a; color: #fff; padding: 10px 20px; border-radius: 30px; border: 1px solid #333; cursor: pointer; }
        .controls select:focus { outline: 2px solid #e94560; }
        .episode-list { margin-top: 30px; background: #14141e; padding: 20px; border-radius: 15px; }
        .episode-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; }
        .ep-btn { background: #1e1e2a; padding: 8px 18px; border-radius: 30px; border: 1px solid #333; color: #aaa; cursor: pointer; transition: 0.2s; }
        .ep-btn:hover { background: #e94560; color: #fff; border-color: #e94560; }
        .ep-btn.active { background: #e94560; color: #fff; border-color: #e94560; }
        .info-title { font-size: 1.8rem; margin-bottom: 10px; }
        .back-btn { background: #e94560; padding: 8px 25px; border-radius: 30px; border: none; color: #fff; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; }
        .back-btn:hover { background: #ff6b81; }
        .loading-player { text-align: center; padding: 30px; color: #888; }
        .player-error { color: #e94560; text-align: center; padding: 30px; }
        @media (max-width: 600px) { .navbar { flex-direction: column; align-items: flex-start; } .controls { flex-direction: column; align-items: stretch; } }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="index.html">🏠 AnimeHub</a>
        <span>▶ Сейчас смотрим</span>
        <span id="animeTitleDisplay" style="margin-left: auto; color: #e94560; font-weight: bold;">Загрузка...</span>
    </div>

    <div class="player-wrapper">
        <h2 id="animeTitle" class="info-title">Загрузка информации...</h2>
        
        <div class="video-container" id="videoContainer">
            <div id="playerLoader" class="loading-player">
                <div style="display:inline-block; width:40px; height:40px; border:4px solid #333; border-top:4px solid #e94560; border-radius:50%; animation:spin 1s linear infinite;"></div>
                <p style="margin-top:15px;">Загрузка плеера...</p>
            </div>
            <iframe id="animeIframe" src="about:blank" allowfullscreen style="display:none;"></iframe>
        </div>

        <div class="controls">
            <label>🎙 Озвучка:</label>
            <select id="voiceSelect" onchange="changeVoice()">
                <option value="anilibria">AniLibria</option>
                <option value="shiza">Shiba</option>
                <option value="anidub">AniDUB</option>
                <option value="kodik">Kodik</option>
            </select>
            
            <label style="margin-left: 20px;">📺 Серия:</label>
            <select id="episodeSelect" onchange="changeEpisode()">
                <option value="1">1 серия</option>
            </select>

            <a href="index.html" class="back-btn" style="margin-left: auto;">← Назад</a>
        </div>

        <div class="episode-list">
            <h4>Все серии</h4>
            <div class="episode-grid" id="episodeGrid">
                <div class="loading-player">Загрузка серий...</div>
            </div>
        </div>
    </div>

    <script>
        // Получаем код аниме из URL
        const urlParams = new URLSearchParams(window.location.search);
        let animeCode = urlParams.get('code') || 'jujutsu-kaisen';
        let currentEpisode = 1;
        let currentVoice = 'anilibria';
        let animeData = null;
        let animeId = null;

        // Провайдеры видео (работают через внешние плееры)
        // В реальности нужно подставлять ID аниме из API
        const videoProviders = {
            'anilibria': (id, ep) => `https://anilibria.tv/embed/${id}/${ep}`,
            'shiza': (id, ep) => `https://shiza-project.ru/embed/${id}/${ep}`,
            'anidub': (id, ep) => `https://anidub.com/player/${id}/${ep}`,
            'kodik': (id, ep) => `https://kodik.cc/serial/${id}/${ep}/720p`
        };

        // Функция получения данных об аниме через API
        async function fetchAnimeData(code) {
            try {
                // Сначала пробуем поискать по коду
                let response = await fetch(`https://api.anilibria.tv/v2/title/search?query=${encodeURIComponent(code)}`);
                let data = await response.json();
                
                let result = null;
                if (Array.isArray(data) && data.length > 0) {
                    result = data[0];
                } else if (data && data.id) {
                    result = data;
                } else if (data && data.list && data.list.length > 0) {
                    result = data.list[0];
                }

                // Если не нашли по коду - пробуем по ID
                if (!result && !isNaN(code)) {
                    response = await fetch(`https://api.anilibria.tv/v2/title/${code}`);
                    data = await response.json();
                    if (data && data.id) result = data;
                }

                return result;
            } catch (error) {
                console.error('Ошибка получения данных:', error);
                return null;
            }
        }

        // Основная функция загрузки плеера
        async function loadPlayer() {
            const titleDisplay = document.getElementById('animeTitleDisplay');
            const titleElem = document.getElementById('animeTitle');
            const grid = document.getElementById('episodeGrid');
            const loader = document.getElementById('playerLoader');
            const iframe = document.getElementById('animeIframe');

            try {
                // Получаем данные об аниме
                animeData = await fetchAnimeData(animeCode);
                
                if (animeData) {
                    const title = animeData.title || 'Без названия';
                    titleDisplay.textContent = title;
                    titleElem.textContent = title;
                    animeId = animeData.id;

                    // Генерируем серии
                    const episodes = animeData.episodes || 12;
                    grid.innerHTML = '';
                    for (let i = 1; i <= episodes; i++) {
                        const btn = document.createElement('div');
                        btn.className = 'ep-btn' + (i === currentEpisode ? ' active' : '');
                        btn.textContent = i;
                        btn.onclick = function() {
                            document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
                            this.classList.add('active');
                            currentEpisode = i;
                            updateVideo();
                        };
                        grid.appendChild(btn);
                    }

                    // Обновляем селектор серий
                    const epSelect = document.getElementById('episodeSelect');
                    epSelect.innerHTML = '';
                    for (let i = 1; i <= episodes; i++) {
                        const opt = document.createElement('option');
                        opt.value = i;
                        opt.textContent = i + ' серия';
                        if (i === currentEpisode) opt.selected = true;
                        epSelect.appendChild(opt);
                    }

                } else {
                    // Если не нашли в API - используем заглушку
                    titleDisplay.textContent = decodeURIComponent(animeCode).replace(/-/g, ' ');
                    titleElem.textContent = decodeURIComponent(animeCode).replace(/-/g, ' ');
                    animeId = 85; // ID по умолчанию
                    
                    grid.innerHTML = '';
                    for (let i = 1; i <= 12; i++) {
                        const btn = document.createElement('div');
                        btn.className = 'ep-btn' + (i === currentEpisode ? ' active' : '');
                        btn.textContent = i;
                        btn.onclick = function() {
                            document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
                            this.classList.add('active');
                            currentEpisode = i;
                            updateVideo();
                        };
                        grid.appendChild(btn);
                    }
                }

                // Загружаем видео
                updateVideo();

            } catch (error) {
                console.error('Ошибка:', error);
                grid.innerHTML = `<div class="player-error">⚠️ Ошибка загрузки данных</div>`;
            }
        }

        function updateVideo() {
            const iframe = document.getElementById('animeIframe');
            const loader = document.getElementById('playerLoader');
            
            // Получаем ссылку на видео
            const provider = videoProviders[currentVoice] || videoProviders['anilibria'];
            const videoUrl = provider(animeId || 85, currentEpisode);
            
            // Показываем iframe
            iframe.style.display = 'block';
            loader.style.display = 'none';
            iframe.src = videoUrl;
        }

        function changeVoice() {
            currentVoice = document.getElementById('voiceSelect').value;
            updateVideo();
        }

        function changeEpisode() {
            currentEpisode = parseInt(document.getElementById('episodeSelect').value);
            document.querySelectorAll('.ep-btn').forEach((btn, index) => {
                btn.classList.toggle('active', (index + 1) === currentEpisode);
            });
            updateVideo();
        }

        // Запускаем
        loadPlayer();
    </script>
</body>
</html>
