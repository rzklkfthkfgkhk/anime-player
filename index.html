<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimePortal - Просмотр Аниме</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --surface-color: #1f2833;
            --primary-color: #66fcf1;
            --text-color: #c5c6c7;
            --text-bright: #ffffff;
            --accent-color: #45a29e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            background-color: var(--surface-color);
            padding: 1rem 2rem;
            border-bottom: 2px solid var(--primary-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            color: var(--primary-color);
            cursor: pointer;
            font-size: 1.8rem;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        /* Форма поиска и фильтров */
        .search-section {
            background-color: var(--surface-color);
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .search-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .search-bar input {
            flex: 1;
            padding: 0.75rem;
            border-radius: 4px;
            border: 1px solid var(--accent-color);
            background: #0b0c10;
            color: var(--text-bright);
            font-size: 1rem;
        }

        button {
            padding: 0.75rem 1.5rem;
            background-color: var(--primary-color);
            color: var(--bg-color);
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-color);
            color: var(--text-bright);
        }

        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .filters select {
            padding: 0.5rem;
            border-radius: 4px;
            background: #0b0c10;
            color: var(--text-color);
            border: 1px solid var(--accent-color);
        }

        /* Сетка результатов */
        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .anime-card {
            background-color: var(--surface-color);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }

        .anime-card:hover {
            transform: translateY(-5px);
        }

        .card-poster {
            width: 100%;
            height: 310px;
            object-fit: cover;
            background-color: #111;
        }

        .card-content {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .card-title {
            color: var(--text-bright);
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 3.2rem;
        }

        .card-info {
            font-size: 0.85rem;
            margin-bottom: 1rem;
            color: #959697;
        }

        .card-rating {
            display: inline-block;
            background: #e67e22;
            color: #fff;
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            font-weight: bold;
            margin-bottom: 0.5rem;
            align-self: flex-start;
        }

        .card-content button {
            margin-top: auto;
            width: 100%;
        }

        /* Детальная страница */
        .detail-page {
            display: none;
            background-color: var(--surface-color);
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .detail-header {
            display: flex;
            gap: 2rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .detail-poster {
            width: 250px;
            border-radius: 4px;
            object-fit: cover;
        }

        .detail-info {
            flex: 1;
            min-width: 300px;
        }

        .detail-info h2 {
            color: var(--text-bright);
            margin-bottom: 1rem;
        }

        .detail-meta-item {
            margin-bottom: 0.5rem;
        }

        .detail-meta-item strong {
            color: var(--primary-color);
        }

        .player-section {
            margin-top: 2rem;
            border-top: 1px solid var(--accent-color);
            padding-top: 2rem;
        }

        .translation-selector {
            margin-bottom: 1rem;
        }

        .translation-selector select {
            padding: 0.5rem;
            width: 100%;
            max-width: 400px;
            background: #0b0c10;
            color: var(--text-bright);
            border: 1px solid var(--primary-color);
            border-radius: 4px;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Пагинация */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
        }

        .hidden {
            display: none !important;
        }

        .error-message {
            grid-column: 1 / -1;
            text-align: center;
            padding: 2rem;
            font-size: 1.2rem;
            color: var(--accent-color);
        }

        @media (max-width: 768px) {
            .detail-header {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1 id="logo">AnimePortal</h1>
    </header>

    <div class="container">
        <!-- Главный экран каталога -->
        <div id="catalog-screen">
            <section class="search-section">
                <form id="search-form">
                    <div class="search-bar">
                        <input type="text" id="search-input" placeholder="Введите название аниме (на русском или английском)...">
                        <button type="submit">Поиск</button>
                    </div>
                    <div class="filters">
                        <select id="filter-kind">
                            <option value="">Все типы</option>
                            <option value="tv">ТВ-сериал</option>
                            <option value="movie">Фильм</option>
                            <option value="ova">OVA</option>
                            <option value="ona">ONA</option>
                            <option value="special">Спецвыпуск</option>
                        </select>
                        <select id="filter-status">
                            <option value="">Все статусы</option>
                            <option value="released">Вышло</option>
                            <option value="ongoing">Выходит</option>
                            <option value="anons">Анонсировано</option>
                        </select>
                        <select id="filter-year">
                            <option value="">Все года</option>
                            <!-- Будет заполнено через JS -->
                        </select>
                    </div>
                </form>
            </section>

            <h2 id="section-title" style="margin-bottom: 1.5rem; color: var(--text-bright);">Недавно добавленные</h2>
            
            <div class="anime-grid" id="anime-container">
                <!-- Карточки загружаются динамически -->
            </div>

            <div class="pagination" id="pagination-controls">
                <button id="btn-prev" disabled>Назад</button>
                <button id="btn-next">Вперед</button>
            </div>
        </div>

        <!-- Экран детальной информации -->
        <div id="detail-screen" class="detail-page">
            <button id="btn-back" style="margin-bottom: 1.5rem;">← Назад к списку</button>
            <div class="detail-header" id="detail-header-content">
                <!-- Контент генерируется через JS -->
            </div>
            <div class="player-section">
                <h3 style="margin-bottom: 1rem; color: var(--text-bright);">Просмотр онлайн</h3>
                <div class="translation-selector">
                    <label for="voice-select" style="display:block; margin-bottom:0.5rem;">Выберите озвучку / перевод:</label>
                    <select id="voice-select">
                        <!-- Опции озвучек -->
                    </select>
                </div>
                <div class="video-container">
                    <iframe id="kodik-player" allowfullscreen></iframe>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Конфигурация API
        const CONFIG = {
            API_URL: 'https://kodik-api.com',
            TOKEN: '1849e7b2339ee8eb64817452d3ef1d59', // Демо-токен из документации Kodik
            LIMIT: 20,
            // Публичный CORS-прокси для предотвращения блокировок в браузере
            CORS_PROXY: 'https://api.allorigins.win/raw?url='
        };

        // Состояние приложения
        let state = {
            currentPage: 1,
            currentMode: 'list', // 'list' или 'search'
            searchQuery: '',
            filters: {
                kind: '',
                status: '',
                year: ''
            },
            currentAnimeList: [],
            rawAnimeData: []
        };

        // Инициализация элементов DOM
        const dom = {
            logo: document.getElementById('logo'),
            catalogScreen: document.getElementById('catalog-screen'),
            detailScreen: document.getElementById('detail-screen'),
            searchForm: document.getElementById('search-form'),
            searchInput: document.getElementById('search-input'),
            filterKind: document.getElementById('filter-kind'),
            filterStatus: document.getElementById('filter-status'),
            filterYear: document.getElementById('filter-year'),
            animeContainer: document.getElementById('anime-container'),
            sectionTitle: document.getElementById('section-title'),
            btnPrev: document.getElementById('btn-prev'),
            btnNext: document.getElementById('btn-next'),
            btnBack: document.getElementById('btn-back'),
            detailHeader: document.getElementById('detail-header-content'),
            voiceSelect: document.getElementById('voice-select'),
            player: document.getElementById('kodik-player'),
            paginationControls: document.getElementById('pagination-controls')
        };

        // Запуск приложения
        init();

        function init() {
            generateYearFilter();
            loadAnimeData();
            setupEventListeners();
        }

        // Заполнение фильтра годов
        function generateYearFilter() {
            const currentYear = new Date().getFullYear();
            for (let y = currentYear; y >= 1980; y--) {
                const opt = document.createElement('option');
                opt.value = y;
                opt.textContent = y;
                dom.filterYear.appendChild(opt);
            }
        }

        // Вспомогательная функция для форматирования ссылок плеера
        function formatPlayerUrl(url) {
            if (!url) return '';
            if (url.startsWith('//')) {
                return 'https:' + url;
            }
            return url;
        }

        // Слушатели событий
        function setupEventListeners() {
            dom.logo.addEventListener('click', () => {
                state.currentMode = 'list';
                state.currentPage = 1;
                dom.searchForm.reset();
                loadAnimeData();
                showScreen('catalog');
            });

            dom.searchForm.addEventListener('submit', (e) => {
                e.preventDefault();
                state.currentMode = 'search';
                state.currentPage = 1;
                state.searchQuery = dom.searchInput.value.trim();
                state.filters.kind = dom.filterKind.value;
                state.filters.status = dom.filterStatus.value;
                state.filters.year = dom.filterYear.value;
                loadAnimeData();
            });

            dom.btnPrev.addEventListener('click', () => {
                if (state.currentPage > 1) {
                    state.currentPage--;
                    loadAnimeData();
                }
            });

            dom.btnNext.addEventListener('click', () => {
                state.currentPage++;
                loadAnimeData();
            });

            dom.btnBack.addEventListener('click', () => {
                showScreen('catalog');
            });

            dom.voiceSelect.addEventListener('change', (e) => {
                dom.player.src = formatPlayerUrl(e.target.value);
            });
        }

        // Функция запроса к API с проксированием
        async function fetchFromKodik(endpoint, params = {}) {
            const urlParams = new URLSearchParams({
                token: CONFIG.TOKEN,
                limit: CONFIG.LIMIT,
                with_material_data: 'true',
                ...params
            });
            const targetUrl = `${CONFIG.API_URL}${endpoint}?${urlParams.toString()}`;
            const finalUrl = CONFIG.CORS_PROXY + encodeURIComponent(targetUrl);
            
            try {
                const response = await fetch(finalUrl);
                if (!response.ok) throw new Error('Ошибка сети при запросе к API');
                return await response.json();
            } catch (error) {
                console.error('Ошибка запроса:', error);
                throw new Error('Не удалось соединиться с API. Проверьте интернет-соединение.');
            }
        }

        // Загрузка данных
        async function loadAnimeData() {
            dom.animeContainer.innerHTML = 'Загрузка данных...';
            try {
                let data;
                let params = { page: state.currentPage };
                
                if (state.currentMode === 'list') {
                    dom.sectionTitle.textContent = 'Недавно добавленные';
                    params.types = 'anime-serial,anime';
                    data = await fetchFromKodik('/list', params);
                } else {
                    dom.sectionTitle.textContent = 'Результаты поиска';
                    if (state.searchQuery) params.title = state.searchQuery;
                    if (state.filters.kind) params.anime_kind = state.filters.kind;
                    if (state.filters.status) params.anime_status = state.filters.status;
                    if (state.filters.year) params.year = state.filters.year;
                    data = await fetchFromKodik('/search', params);
                }
                
                state.rawAnimeData = data.results || [];
                state.currentAnimeList = deduplicateAnime(state.rawAnimeData);
                renderCatalog();
                renderPagination(data.total);
            } catch (error) {
                console.error(error);
                dom.animeContainer.innerHTML = `<div class="error-message">${error.message}</div>`;
            }
        }

        // Фильтрация дубликатов
        function deduplicateAnime(results) {
            const seen = new Set();
            return results.filter(item => {
                const id = item.shikimori_id || item.id;
                if (seen.has(id)) return false;
                seen.add(id);
                return true;
            });
        }

        // Отрисовка списка карточек
        function renderCatalog() {
            dom.animeContainer.innerHTML = '';
            if (state.currentAnimeList.length === 0) {
                dom.animeContainer.innerHTML = '<div class="error-message">Ничего не найдено по вашему запросу.</div>';
                return;
            }

            state.currentAnimeList.forEach(anime => {
                const mData = anime.material_data || {};
                const title = anime.title || mData.anime_title || 'Без названия';
                const poster = mData.poster_url || (anime.screenshots && anime.screenshots[0]) || 'https://via.placeholder.com/220x310/1f2833/66fcf1?text=No+Image';
                const rating = mData.shikimori_rating || mData.kinopoisk_rating || null;
                const year = anime.year || mData.year || 'Неизвестно';
                const kind = mData.anime_kind ? translateKind(mData.anime_kind) : 'ТВ-сериал';
                
                const card = document.createElement('div');
                card.className = 'anime-card';
                card.innerHTML = `
                    <img src="${poster}" class="card-poster" alt="${title}" loading="lazy" onerror="this.src='https://via.placeholder.com/220x310/1f2833/66fcf1?text=No+Image'">
                    <div class="card-content">
                        <div class="card-title" title="${title}">${title}</div>
                        ${rating ? `<div class="card-rating">★ ${rating}</div>` : ''}
                        <div class="card-info">${year} • ${kind}</div>
                        <button onclick="openAnimeDetails('${anime.shikimori_id || anime.id}')">Подробнее</button>
                    </div>
                `;
                dom.animeContainer.appendChild(card);
            });
        }

        // Управление пагинацией
        function renderPagination(totalCount) {
            dom.btnPrev.disabled = state.currentPage === 1;
            dom.btnNext.disabled = !totalCount || (state.currentPage * CONFIG.LIMIT) >= totalCount;
            
            if (state.currentMode === 'search' && (!totalCount || totalCount <= CONFIG.LIMIT)) {
                dom.paginationControls.classList.add('hidden');
            } else {
                dom.paginationControls.classList.remove('hidden');
            }
        }

        // Открытие карточки
        function openAnimeDetails(uniqueId) {
            const variants = state.rawAnimeData.filter(item => (item.shikimori_id || item.id) == uniqueId);
            if (variants.length === 0) return;

            const primaryAnime = variants[0];
            const mData = primaryAnime.material_data || {};

            dom.detailHeader.innerHTML = `
                <img src="${mData.poster_url || (primaryAnime.screenshots && primaryAnime.screenshots[0]) || 'https://via.placeholder.com/250x350/1f2833/66fcf1?text=No+Image'}" 
                     class="detail-poster" alt="${primaryAnime.title}"
                     onerror="this.src='https://via.placeholder.com/250x350/1f2833/66fcf1?text=No+Image'">
                <div class="detail-info">
                    <h2>${primaryAnime.title} (${primaryAnime.title_orig || ''})</h2>
                    <p style="margin-bottom: 1rem; font-style: italic;">${mData.description || 'Описание отсутствует.'}</p>
                    <div class="detail-meta-item"><strong>Год:</strong> ${primaryAnime.year || mData.year || '-'}</div>
                    <div class="detail-meta-item"><strong>Тип:</strong> ${translateKind(mData.anime_kind || '')}</div>
                    <div class="detail-meta-item"><strong>Статус:</strong> ${translateStatus(mData.anime_status || '')}</div>
                    <div class="detail-meta-item"><strong>Жанры:</strong> ${mData.anime_genres ? mData.anime_genres.join(', ') : '-'}</div>
                    <div class="detail-meta-item"><strong>Студия:</strong> ${mData.anime_studios ? mData.anime_studios.join(', ') : '-'}</div>
                    <div class="detail-meta-item"><strong>Рейтинг Shikimori:</strong> ${mData.shikimori_rating || '-'}</div>
                    <div class="detail-meta-item"><strong>Рейтинг Кинопоиск:</strong> ${mData.kinopoisk_rating || '-'}</div>
                </div>
            `;

            dom.voiceSelect.innerHTML = '';
            variants.forEach(variant => {
                const opt = document.createElement('option');
                const episodesInfo = variant.last_episode ? ` (1-${variant.last_episode} сер.)` : '';
                opt.textContent = `${variant.translation.title}${episodesInfo}`;
                opt.value = variant.link;
                dom.voiceSelect.appendChild(opt);
            });

            if (variants.length > 0) {
                dom.player.src = formatPlayerUrl(variants[0].link);
            }

            showScreen('detail');
        }

        // Переключение экранов
        function showScreen(screen) {
            if (screen === 'catalog') {
                dom.catalogScreen.style.display = 'block';
                dom.detailScreen.style.display = 'none';
                dom.player.src = '';
            } else {
                dom.catalogScreen.style.display = 'none';
                dom.detailScreen.style.display = 'block';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        // Вспомогательные функции перевода
        function translateKind(kind) {
            const mapping = { 'tv': 'ТВ-сериал', 'movie': 'Фильм', 'ova': 'OVA', 'ona': 'ONA', 'special': 'Спецвыпуск' };
            return mapping[kind.toLowerCase()] || kind;
        }

        function translateStatus(status) {
            const mapping = { 'released': 'Вышло', 'ongoing': 'Выходит', 'anons': 'Анонсировано' };
            return mapping[status.toLowerCase()] || status;
        }

        // Делаем функцию открытия деталей глобальной для onclick
        window.openAnimeDetails = openAnimeDetails;
    </script>
</body>
</html>
